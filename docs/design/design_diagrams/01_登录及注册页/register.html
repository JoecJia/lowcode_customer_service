<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>注册 - 智能客服平台</title>
<style>
  :root {
    --color-primary: #2B67FF;
    --color-primary-hover: #3D82F2;
    --color-primary-active: #0057FF;
    --color-primary-light: #EBF2FF;
    --color-success: #4DD655;
    --color-warning: #FBA233;
    --color-danger: #F53F3F;
    --color-text-primary: #212633;
    --color-text-secondary: #465164;
    --color-text-tertiary: #717989;
    --color-text-disabled: #BABECF;
    --color-border: #DEE0E3;
    --color-border-light: #EAECF1;
    --color-bg-page: #F0F2F7;
    --color-bg-card: #FFFFFF;
    --color-bg-hover: #F5F6FA;
    --radius-sm: 4px;
    --radius-md: 8px;
    --radius-lg: 12px;
    --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
    --shadow-lg: 0 8px 24px rgba(0,0,0,0.12);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    background: linear-gradient(135deg, #2B67FF 0%, #5B8CFF 100%);
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    -webkit-font-smoothing: antialiased;
  }

  .decor-circle { position: fixed; border-radius: 50%; opacity: 0.06; pointer-events: none; }
  .decor-circle-1 { width: 500px; height: 500px; background: #fff; top: -180px; left: -120px; }
  .decor-circle-2 { width: 350px; height: 350px; background: #fff; bottom: -80px; right: -80px; }

  .register-card {
    position: relative; z-index: 1;
    width: 400px;
    background: var(--color-bg-card);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-lg);
    padding: 40px;
  }

  /* ① 标题 */
  .brand { text-align: center; margin-bottom: 28px; }
  .brand-logo {
    width: 48px; height: 48px; background: linear-gradient(135deg, #2B67FF, #3D82F2);
    border-radius: var(--radius-lg); margin: 0 auto 16px;
    display: flex; align-items: center; justify-content: center;
  }
  .brand-logo svg { width: 28px; height: 28px; }
  .brand-title { font-size: 20px; font-weight: 600; color: var(--color-text-primary); line-height: 28px; }
  .brand-subtitle { font-size: 14px; color: var(--color-text-tertiary); margin-top: 4px; }

  .error-msg {
    display: none; align-items: center; gap: 8px;
    background: #FFF0F0; border-radius: var(--radius-sm);
    padding: 10px 12px; margin-bottom: 16px;
    font-size: 13px; color: var(--color-danger); line-height: 20px;
  }
  .error-msg.show { display: flex; }
  .error-msg svg { width: 16px; height: 16px; flex-shrink: 0; }

  .form-group { margin-bottom: 18px; }
  .form-label { display: block; font-size: 14px; font-weight: 500; color: var(--color-text-primary); margin-bottom: 8px; line-height: 22px; }

  /* ② ③ ④ 输入框 */
  .input-wrapper { position: relative; }
  .input-field {
    width: 100%; height: 40px; padding: 0 12px;
    font-size: 14px; color: var(--color-text-primary);
    background: var(--color-bg-card);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-sm);
    outline: none; transition: border-color 0.2s ease, box-shadow 0.2s ease;
    font-family: inherit;
  }
  .input-field::placeholder { color: var(--color-text-disabled); }
  .input-field:focus { border-color: var(--color-primary); box-shadow: 0 0 0 2px rgba(43,103,255,0.15); }
  .input-field.error { border-color: var(--color-danger); box-shadow: 0 0 0 2px rgba(245,63,63,0.15); }
  .input-field.success { border-color: var(--color-success); }

  .pwd-toggle {
    position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
    background: none; border: none; cursor: pointer; padding: 4px;
    color: var(--color-text-tertiary); display: flex; align-items: center;
    transition: color 0.2s ease;
  }
  .pwd-toggle:hover { color: var(--color-text-secondary); }
  .pwd-toggle svg { width: 18px; height: 18px; }

  .field-error {
    display: none; font-size: 12px; color: var(--color-danger);
    margin-top: 6px; line-height: 18px;
  }
  .field-error.show { display: block; }

  /* 密码强度指示器 */
  .pwd-strength { display: flex; gap: 6px; margin-top: 8px; }
  .pwd-strength-bar {
    flex: 1; height: 4px; border-radius: 2px;
    background: var(--color-border-light); transition: background 0.3s ease;
  }
  .pwd-strength-bar.weak { background: var(--color-danger); }
  .pwd-strength-bar.medium { background: var(--color-warning); }
  .pwd-strength-bar.strong { background: var(--color-success); }
  .pwd-strength-text { font-size: 12px; margin-top: 4px; color: var(--color-text-tertiary); }

  /* 确认密码匹配状态 */
  .confirm-status {
    display: none; align-items: center; gap: 6px;
    font-size: 12px; margin-top: 6px; line-height: 18px;
  }
  .confirm-status.show { display: flex; }
  .confirm-status.match { color: var(--color-success); }
  .confirm-status.mismatch { color: var(--color-danger); }

  /* ⑤ 注册按钮 */
  .btn-register {
    width: 100%; height: 40px;
    background: linear-gradient(135deg, #2B67FF 0%, #3D82F2 100%);
    border: none; border-radius: var(--radius-sm);
    font-size: 16px; font-weight: 500; color: #fff;
    cursor: pointer; margin-top: 6px;
    transition: all 0.2s ease;
    font-family: inherit; letter-spacing: 0.5px;
  }
  .btn-register:hover { background: linear-gradient(135deg, #3D82F2 0%, #5B8CFF 100%); }
  .btn-register:active { background: var(--color-primary-active); transform: scale(0.98); }

  /* ⑥ 返回登录 */
  .login-link { text-align: center; margin-top: 18px; font-size: 14px; color: var(--color-text-tertiary); }
  .login-link a { color: var(--color-primary); text-decoration: none; font-weight: 500; transition: color 0.2s ease; }
  .login-link a:hover { color: var(--color-primary-hover); }

  /* Toast */
  .toast {
    position: fixed; top: 24px; left: 50%; transform: translateX(-50%);
    background: var(--color-bg-card); border-radius: var(--radius-sm);
    box-shadow: var(--shadow-md); padding: 12px 24px;
    font-size: 14px; color: var(--color-text-primary);
    display: none; z-index: 999; align-items: center; gap: 8px;
  }
  .toast.show { display: flex; animation: toastIn 0.3s ease-out; }
  .toast.success { color: #2B7A3A; }
  .toast.error { color: var(--color-danger); }
  @keyframes toastIn {
    from { opacity: 0; transform: translateX(-50%) translateY(-10px); }
    to { opacity: 1; transform: translateX(-50%) translateY(0); }
  }
</style>
</head>
<body>

<div class="decor-circle decor-circle-1"></div>
<div class="decor-circle decor-circle-2"></div>

<div class="toast" id="toast"><span id="toastMsg"></span></div>

<div class="register-card">
  <!-- ① 标题 -->
  <div class="brand">
    <div class="brand-logo">
      <svg viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="2" y="2" width="24" height="24" rx="6" fill="white" fill-opacity="0.2"/>
        <path d="M8 14c0-1.5 0.5-3 1.5-4l4.5 4-4.5 4A6.5 6.5 0 0 1 8 14z" fill="white"/>
        <path d="M20 14c0 1.5-0.5 3-1.5 4l-4.5-4 4.5-4A6.5 6.5 0 0 1 20 14z" fill="white" fill-opacity="0.6"/>
        <circle cx="14" cy="14" r="3" fill="white"/>
      </svg>
    </div>
    <h1 class="brand-title">创建新账号</h1>
    <p class="brand-subtitle">加入智能客服平台</p>
  </div>

  <div class="error-msg" id="errorMsg">
    <svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 1a7 7 0 1 1 0 14A7 7 0 0 1 8 1zm0 10a.75.75 0 1 0 0 1.5.75.75 0 0 0 0-1.5zM7.25 5v4a.75.75 0 0 0 1.5 0V5a.75.75 0 0 0-1.5 0z"/></svg>
    <span id="errorText">注册失败</span>
  </div>

  <!-- ② 用户名 -->
  <div class="form-group">
    <label class="form-label">用户名</label>
    <input type="text" class="input-field" id="username" placeholder="请输入用户名（4-20位字符）" autocomplete="username">
    <div class="field-error" id="usernameError">请输入用户名</div>
  </div>

  <!-- ③ 密码 -->
  <div class="form-group">
    <label class="form-label">密码</label>
    <div class="input-wrapper">
      <input type="password" class="input-field" id="password" placeholder="请输入密码（至少8位，含字母和数字）" autocomplete="new-password">
      <button class="pwd-toggle" id="pwdToggle1" type="button">
        <svg class="eye-off" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M2 9s2.5-5 7-5 7 5 7 5-2.5 5-7 5-7-5-7-5z"/><circle cx="9" cy="9" r="2"/>
          <line x1="2" y1="2" x2="16" y2="16"/>
        </svg>
        <svg class="eye-on" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" style="display:none">
          <path d="M2 9s2.5-5 7-5 7 5 7 5-2.5 5-7 5-7-5-7-5z"/><circle cx="9" cy="9" r="2"/>
        </svg>
      </button>
    </div>
    <div class="pwd-strength" id="pwdStrength">
      <div class="pwd-strength-bar" id="bar1"></div>
      <div class="pwd-strength-bar" id="bar2"></div>
      <div class="pwd-strength-bar" id="bar3"></div>
    </div>
    <div class="pwd-strength-text" id="pwdStrengthText">请设置安全性较高的密码</div>
  </div>

  <!-- ④ 确认密码 -->
  <div class="form-group">
    <label class="form-label">确认密码</label>
    <div class="input-wrapper">
      <input type="password" class="input-field" id="confirmPwd" placeholder="请再次输入密码" autocomplete="new-password">
      <button class="pwd-toggle" id="pwdToggle2" type="button">
        <svg class="eye-off" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M2 9s2.5-5 7-5 7 5 7 5-2.5 5-7 5-7-5-7-5z"/><circle cx="9" cy="9" r="2"/>
          <line x1="2" y1="2" x2="16" y2="16"/>
        </svg>
        <svg class="eye-on" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" style="display:none">
          <path d="M2 9s2.5-5 7-5 7 5 7 5-2.5 5-7 5-7-5-7-5z"/><circle cx="9" cy="9" r="2"/>
        </svg>
      </button>
    </div>
    <div class="confirm-status" id="confirmStatus">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="currentColor" id="confirmIcon">
        <circle cx="7" cy="7" r="7"/>
        <path d="M4.5 7l2 2 3-4" stroke="white" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span id="confirmText">密码一致</span>
    </div>
  </div>

  <!-- ⑤ 注册按钮 -->
  <button class="btn-register" id="btnRegister">注 册</button>

  <!-- ⑥ 返回登录 -->
  <div class="login-link">
    已有账号？<a href="login.html">返回登录</a>
  </div>
</div>

<script>
  var usernameEl = document.getElementById('username');
  var passwordEl = document.getElementById('password');
  var confirmPwdEl = document.getElementById('confirmPwd');
  var btnRegister = document.getElementById('btnRegister');
  var errorMsg = document.getElementById('errorMsg');
  var errorText = document.getElementById('errorText');
  var usernameError = document.getElementById('usernameError');
  var confirmStatus = document.getElementById('confirmStatus');
  var confirmIcon = document.getElementById('confirmIcon');
  var confirmText = document.getElementById('confirmText');
  var pwdStrengthText = document.getElementById('pwdStrengthText');
  var toast = document.getElementById('toast');
  var toastMsg = document.getElementById('toastMsg');

  function showToast(msg, type) {
    toastMsg.textContent = msg;
    toast.className = 'toast show ' + type;
    setTimeout(function() { toast.classList.remove('show'); }, 2500);
  }

  function clearErrors() {
    errorMsg.classList.remove('show');
    usernameEl.classList.remove('error');
    usernameError.classList.remove('show');
  }

  function setupPwdToggle(btnId, inputEl) {
    document.getElementById(btnId).addEventListener('click', function() {
      var offEl = this.querySelector('.eye-off');
      var onEl = this.querySelector('.eye-on');
      if (inputEl.type === 'password') {
        inputEl.type = 'text';
        offEl.style.display = 'none';
        onEl.style.display = 'block';
      } else {
        inputEl.type = 'password';
        offEl.style.display = 'block';
        onEl.style.display = 'none';
      }
    });
  }
  setupPwdToggle('pwdToggle1', passwordEl);
  setupPwdToggle('pwdToggle2', confirmPwdEl);

  function getPwdStrength(pwd) {
    if (pwd.length < 6) return 0;
    var score = 0;
    if (pwd.length >= 8) score++;
    if (/[a-zA-Z]/.test(pwd) && /[0-9]/.test(pwd)) score++;
    if (/[^a-zA-Z0-9]/.test(pwd)) score++;
    return score;
  }

  passwordEl.addEventListener('input', function() {
    var bar1 = document.getElementById('bar1');
    var bar2 = document.getElementById('bar2');
    var bar3 = document.getElementById('bar3');
    [bar1, bar2, bar3].forEach(function(b) { b.className = 'pwd-strength-bar'; });

    var strength = getPwdStrength(this.value);
    var labels = ['', '弱', '中', '强'];
    var colors = ['', 'weak', 'medium', 'strong'];

    if (strength >= 1) bar1.className = 'pwd-strength-bar ' + colors[strength];
    if (strength >= 2) bar2.className = 'pwd-strength-bar ' + colors[strength];
    if (strength >= 3) bar3.className = 'pwd-strength-bar ' + colors[strength];

    pwdStrengthText.textContent = strength === 0 ? '请设置安全性较高的密码' : '密码强度：' + labels[strength];
    pwdStrengthText.style.color = strength === 0 ? 'var(--color-text-tertiary)' :
      strength === 1 ? 'var(--color-danger)' : strength === 2 ? 'var(--color-warning)' : 'var(--color-success)';

    checkConfirm();
  });

  function checkConfirm() {
    var cp = confirmPwdEl.value;
    var p = passwordEl.value;
    if (cp === '') {
      confirmStatus.classList.remove('show');
      confirmPwdEl.classList.remove('error', 'success');
      return;
    }
    confirmStatus.classList.add('show');
    if (cp === p) {
      confirmStatus.className = 'confirm-status show match';
      confirmText.textContent = '密码一致';
      confirmPwdEl.classList.remove('error');
      confirmPwdEl.classList.add('success');
    } else {
      confirmStatus.className = 'confirm-status show mismatch';
      confirmText.textContent = '两次输入的密码不一致';
      confirmPwdEl.classList.remove('success');
      confirmPwdEl.classList.add('error');
    }
  }
  confirmPwdEl.addEventListener('input', checkConfirm);
  passwordEl.addEventListener('input', function() {
    if (confirmPwdEl.value) checkConfirm();
  });

  usernameEl.addEventListener('input', function() {
    usernameEl.classList.remove('error');
    usernameError.classList.remove('show');
    errorMsg.classList.remove('show');
  });

  btnRegister.addEventListener('click', function() {
    clearErrors();
    var u = usernameEl.value.trim();
    var p = passwordEl.value;
    var cp = confirmPwdEl.value;
    var valid = true;

    if (!u) {
      usernameEl.classList.add('error');
      usernameError.textContent = '请输入用户名';
      usernameError.classList.add('show');
      valid = false;
    } else if (u.length < 4) {
      usernameEl.classList.add('error');
      usernameError.textContent = '用户名至少4位字符';
      usernameError.classList.add('show');
      valid = false;
    }

    if (!p) {
      showToast('请输入密码', 'error');
      valid = false;
    } else if (p.length < 8) {
      showToast('密码至少需要8位', 'error');
      valid = false;
    } else if (!/[a-zA-Z]/.test(p) || !/[0-9]/.test(p)) {
      showToast('密码需包含字母和数字', 'error');
      valid = false;
    }

    if (p !== cp) {
      showToast('两次输入的密码不一致', 'error');
      valid = false;
    }

    if (!valid) return;

    btnRegister.textContent = '注册中...';
    btnRegister.style.opacity = '0.7';
    btnRegister.style.pointerEvents = 'none';

    setTimeout(function() {
      btnRegister.textContent = '注 册';
      btnRegister.style.opacity = '1';
      btnRegister.style.pointerEvents = 'auto';

      // 模拟演示：用户名为 admin 时提示已存在
      if (u === 'admin') {
        showToast('用户名已被注册', 'error');
        return;
      }

      showToast('注册成功！正在跳转登录页...', 'success');
    }, 800);
  });

  confirmPwdEl.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') btnRegister.click();
  });
</script>

</body>
</html>
